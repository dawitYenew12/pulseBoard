/projects:
  post:
    summary: Create a project
    description: Only SUPERADMIN can create projects.
    tags: [Projects]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
            properties:
              name:
                type: string
              description:
                type: string
              pmId:
                type: string
                format: uuid
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'
  get:
    summary: Get all projects
    description: Retrieve all projects.
    tags: [Projects]
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: name
        schema:
          type: string
        description: Project name
      - in: query
        name: sortBy
        schema:
          type: string
        description: sort by query in the form of field:desc/asc (ex. name:asc)
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
        default: 10
        description: Maximum number of projects
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        default: 1
        description: Page number
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/Project'
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 10
                totalPages:
                  type: integer
                  example: 1
                totalResults:
                  type: integer
                  example: 1
      "401":
        $ref: '#/components/responses/Unauthorized'

/projects/{projectId}:
  get:
    summary: Get a project
    description: Fetch a project by ID.
    tags: [Projects]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
        description: Project ID
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'
      "404":
        $ref: '#/components/responses/NotFound'
  patch:
    summary: Update a project
    description: Only PM or SUPERADMIN can update the project.
    tags: [Projects]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
        description: Project ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              pmId:
                type: string
                format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'
      "404":
        $ref: '#/components/responses/NotFound'
  delete:
    summary: Delete a project
    description: Only SUPERADMIN can delete a project.
    tags: [Projects]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
        description: Project ID
    responses:
      "204":
        description: No Content
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'
      "404":
        $ref: '#/components/responses/NotFound'

/projects/{projectId}/assign-pm:
  patch:
    summary: Assign PM to project
    description: Only SUPERADMIN can assign a PM.
    tags: [Projects]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - pmId
            properties:
              pmId:
                type: string
                format: uuid
    responses:
      "200":
        description: OK
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'

/projects/{projectId}/members:
  post:
    summary: Add member to project
    description: PM or SUPERADMIN can add members.
    tags: [Projects]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - userId
            properties:
              userId:
                type: string
                format: uuid
    responses:
      "200":
        description: OK
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'

/projects/{projectId}/members/{userId}:
  delete:
    summary: Remove member from project
    description: PM or SUPERADMIN can remove members.
    tags: [Projects]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No Content
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'
