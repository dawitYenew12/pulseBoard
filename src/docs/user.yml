/users:
  get:
    summary: Get all users
    description: Only admins and PMs can retrieve all users.
    tags: [Users]
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: email
        schema:
          type: string
        description: User email
      - in: query
        name: role
        schema:
          type: string
          enum: [SUPERADMIN, PM, EMPLOYEE]
        description: User role
      - in: query
        name: sortBy
        schema:
          type: string
        description: sort by query in the form of field:desc/asc (ex. name:asc)
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
        default: 10
        description: Maximum number of users
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        default: 1
        description: Page number
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/User'
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 10
                totalPages:
                  type: integer
                  example: 1
                totalResults:
                  type: integer
                  example: 1
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'

/users/{userId}:
  get:
    summary: Get a user
    description: Logged in users can fetch only their own user information. Only admins can fetch other users.
    tags: [Users]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
        description: User id
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'
      "404":
        $ref: '#/components/responses/NotFound'

/users/{userId}/role:
  patch:
    summary: Update user role
    description: Only SUPERADMIN can update user roles.
    tags: [Users]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
        description: User id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - role
            properties:
              role:
                type: string
                enum: [SUPERADMIN, PM, EMPLOYEE]
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'
      "404":
        $ref: '#/components/responses/NotFound'

/users/{userId}/projects:
  get:
    summary: Get projects for a specific user
    description: Fetch all projects where the user is either a PM or a member.
    tags: [Users]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
        description: User ID
      - in: query
        name: sortBy
        schema:
          type: string
        description: sort by query in the form of field:desc/asc (ex. name:asc)
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
        default: 10
        description: Maximum number of projects
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        default: 1
        description: Page number
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                result:
                  type: array
                  items:
                    $ref: '#/components/schemas/Project'
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'
      "404":
        $ref: '#/components/responses/NotFound'
