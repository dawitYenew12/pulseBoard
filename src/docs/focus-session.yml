/focus-sessions:
  post:
    summary: Start a focus session
    description: Only EMPLOYEE can start a focus session.
    tags: [FocusSessions]
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - taskId
            properties:
              taskId:
                type: string
                format: uuid
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusSession'
      "401":
        $ref: '#/components/responses/Unauthorized'
      "403":
        $ref: '#/components/responses/Forbidden'

/focus-sessions/active:
  get:
    summary: Get active focus session
    description: Get the currently active session for the logged-in user.
    tags: [FocusSessions]
    security:
      - bearerAuth: []
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusSession'
      "204":
        description: No active session
      "401":
        $ref: '#/components/responses/Unauthorized'

/focus-sessions/analytics:
  get:
    summary: Get focus session analytics
    description: Get analytics for focus sessions.
    tags: [FocusSessions]
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: taskId
        schema:
          type: string
          format: uuid
        description: Filter by Task ID
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/FocusSession'
      "401":
        $ref: '#/components/responses/Unauthorized'

/focus-sessions/{sessionId}/stop:
  post:
    summary: Stop a focus session
    description: Stop a specific focus session.
    tags: [FocusSessions]
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: sessionId
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FocusSession'
      "401":
        $ref: '#/components/responses/Unauthorized'
      "404":
        $ref: '#/components/responses/NotFound'
